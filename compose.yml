# ============================================================
# Milestone Command — local platform topology
# ============================================================
# Brings up the same shape that runs in the cloud, so "works on my
# machine" and "works in the cloud" stop being different questions:
#
#   discovery-server  registry every service registers with
#   api-gateway       single entry point, routes by lb:// name
#   postgres          one database per service (see init/)
#   kafka             the event backbone (Event Hubs speaks this protocol)
#   kafka-ui          browse topics and messages while developing
#
#   docker compose up -d
#   docker compose --profile tools up -d        # adds kafka-ui
#
# The Java services are PULLED, not built: a Codespace has one repo
# checked out, not nine. Working on a service? Stop its container and
# run it from the IDE on the same port — everything else keeps working.
#
#   docker compose stop api-gateway
#   cd ../mc-api-gateway && mvn spring-boot:run
#
# Images are published by the shared java-service.yml pipeline on every
# push to main.

name: milestone-command

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      # A database per service is created by init/01-databases.sql.
      # POSTGRES_DB only seeds the first one.
      POSTGRES_DB: milestone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d milestone"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # KRaft mode: no ZooKeeper. Single broker is right for development —
    # partitioning and replication are a production concern.
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off deliberately: a typo in a topic name should fail loudly, not
      # silently create a topic nobody ever reads.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the platform's topics, then exits. Partitioned by project so
  # per-project ordering holds (platform-architecture.md §8b).
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in milestone.events milestone.audit integration.inbound integration.outbound ai.requests; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
      done
      echo 'topics ready:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    restart: "no"

  discovery-server:
    image: ghcr.io/rachidpeaqock/mc-discovery-server:main
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    image: ghcr.io/rachidpeaqock/mc-api-gateway:main
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        # Starting before the registry is up means a gateway that resolves
        # nothing and logs confusing connection refusals for a minute.
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
