name: Angular app (reusable)

# Shared build pipeline for every Angular front end on the platform:
# mc-shell, mc-dashboards, mc-templates, and later mc-field's web build.
#
# Callers pass their app name; everything else is convention. Changing the
# Node version or adding a check happens here, once, rather than in a
# growing number of near-identical copies.
#
#   permissions:            # REQUIRED - see below
#     contents: read
#     packages: read
#     pull-requests: write
#   jobs:
#     app:
#       uses: rachidpeaqock/mc-platform-infra/.github/workflows/angular-app.yml@main
#       with:
#         app-name: mc-dashboards
#       secrets: inherit
#
# ⚠️ The caller MUST declare `permissions: pull-requests: write`. A called
# workflow can never hold more permission than its caller, and these repos
# default to a read-only token, so requesting it here is an escalation:
# the entire run fails with `startup_failure` at 0s - no logs, no
# annotation, nothing that points at permissions.
#
# One job. Build, check, drive, deploy - the same bundle end to end. There
# is deliberately no artifact between the checks and the deploy; see the
# note above the deploy step for the day that cost a production fix.
#
# This is exactly what killed the deploy job in Sprint 2. It was removed
# rather than diagnosed, and the cause only came to light in Sprint 4 when
# the same failure hit java-service.yml.

on:
  workflow_call:
    inputs:
      app-name:
        description: Angular project name, and the dist subdirectory it builds into
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '20'
      deploy:
        description: Publish to Azure Static Web Apps (main, plus PR previews)
        required: false
        type: boolean
        default: true
      verify:
        description: >
          Run `npm run verify` - build the stub entry point and drive the
          app in a real browser against a stub of the API (MC-345).
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read      # @rachidpeaqock/* comes from GitHub Packages
      # Static Web Apps posts the preview URL as a PR comment. Without this
      # the deploy still works and the comment silently fails.
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@rachidpeaqock'

      # GITHUB_TOKEN authenticates the private design-system package.
      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      # A design-system upgrade that silently dropped the shared tokens
      # would otherwise ship a correctly-built, unstyled app. Assert it.
      - name: Verify build output
        run: |
          set -e
          DIST="dist/${{ inputs.app-name }}/browser"
          test -f "$DIST/index.html" || { echo "no index.html in $DIST"; exit 1; }
          if ! grep -rqs -- '--primary' "$DIST"/*.css; then
            echo "Design tokens missing from the CSS bundle."
            echo "The app built, but @rachidpeaqock/design-system tokens did not land."
            exit 1
          fi
          echo "OK: tokens present in $DIST"

      # MC-345. A green build means "this compiles"; three sprints running,
      # the defects that mattered were things only a rendered page showed -
      # a search box that never filtered, a chart labelled with the wrong
      # years. This drives the real components against a stub of the real
      # contract.
      #
      # No browser download: the runner image already has Google Chrome and
      # verify/harness.mjs prefers it under CI. `playwright` proper would
      # pull ~150 MB per install, per repo, for a check that runs in
      # seconds.
      - name: Drive the app against a stub of the API
        if: inputs.verify
        run: npm run verify

      # ================================================================
      # Deploy — from THIS job, with the bundle the checks above just ran on.
      # ================================================================
      # ⚠️ Not a separate job, and not via an artifact — and that is a
      # lesson, not a style. Until 2026-09-17 the bundle was uploaded as an
      # artifact and a second job downloaded and deployed it. The account's
      # artifact storage quota then filled, the upload was refused, and the
      # deploy job was skipped on every front end for a day — with every
      # build green. A cross-app URL fix sat in `main` while the live sites
      # kept the broken links, and the only sign was a grey "skipped" job.
      # Deploying here removes the hand-off entirely: nothing sits between
      # "the checks passed on this bundle" and "this bundle is live".
      #
      # A repo with deploy: true but no Static Web App yet gets a clear
      # skip, not a failure — turning the intent on before the resource
      # exists is a reasonable order to do things in.
      - name: Check for a deployment token
        id: token
        if: inputs.deploy
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — no Static Web App yet"
              echo
              echo "\`${{ inputs.app-name }}\` asks to be deployed, but this"
              echo "repository has no \`AZURE_STATIC_WEB_APPS_API_TOKEN\` secret."
              echo
              echo "Create the Static Web App and add its deployment token as that"
              echo "secret; the next push publishes with no further code change."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Push to main -> production. Pull request -> its own preview
      # environment, torn down when the PR closes. The action picks which
      # from the triggering event.
      - name: Deploy to Static Web Apps
        if: inputs.deploy && steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/${{ inputs.app-name }}/browser
          # Already built and checked above. Without these the action tries
          # to detect and build the app itself, which for an Angular
          # workspace means building the wrong thing or nothing.
          skip_app_build: true
          skip_api_build: true

      - name: Record what went live
        if: inputs.deploy && steps.token.outputs.present == 'true'
        run: |
          {
            echo "### ✅ Deployed \`${{ inputs.app-name }}\` @ \`${GITHUB_SHA::7}\`"
            echo
            echo "The bundle deployed is the one the checks in this job ran on."
          } >> "$GITHUB_STEP_SUMMARY"
