name: Angular app (reusable)

# Shared build pipeline for every Angular front end on the platform:
# mc-shell, mc-dashboards, mc-templates, and later mc-field's web build.
#
# Callers pass their app name; everything else is convention. Changing the
# Node version or adding a check happens here, once, rather than in a
# growing number of near-identical copies.
#
#   permissions:            # REQUIRED - see below
#     contents: read
#     packages: read
#     pull-requests: write
#   jobs:
#     app:
#       uses: rachidpeaqock/mc-platform-infra/.github/workflows/angular-app.yml@main
#       with:
#         app-name: mc-dashboards
#       secrets: inherit
#
# ⚠️ The caller MUST declare `permissions: pull-requests: write`. A called
# workflow can never hold more permission than its caller, and these repos
# default to a read-only token, so requesting it here is an escalation:
# the entire run fails with `startup_failure` at 0s - no logs, no
# annotation, nothing that points at permissions.
#
# This is exactly what killed the deploy job in Sprint 2. It was removed
# rather than diagnosed, and the cause only came to light in Sprint 4 when
# the same failure hit java-service.yml.

on:
  workflow_call:
    inputs:
      app-name:
        description: Angular project name, and the dist subdirectory it builds into
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '20'
      deploy:
        description: Publish to Azure Static Web Apps (main, plus PR previews)
        required: false
        type: boolean
        default: true
      verify:
        description: >
          Run `npm run verify` - build the stub entry point and drive the
          app in a real browser against a stub of the API (MC-345).
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read      # @rachidpeaqock/* comes from GitHub Packages
    outputs:
      # Whether the deploy job has anything to deploy. See the upload step.
      dist-uploaded: ${{ steps.dist.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@rachidpeaqock'

      # GITHUB_TOKEN authenticates the private design-system package.
      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      # A design-system upgrade that silently dropped the shared tokens
      # would otherwise ship a correctly-built, unstyled app. Assert it.
      - name: Verify build output
        run: |
          set -e
          DIST="dist/${{ inputs.app-name }}/browser"
          test -f "$DIST/index.html" || { echo "no index.html in $DIST"; exit 1; }
          if ! grep -rqs -- '--primary' "$DIST"/*.css; then
            echo "Design tokens missing from the CSS bundle."
            echo "The app built, but @rachidpeaqock/design-system tokens did not land."
            exit 1
          fi
          echo "OK: tokens present in $DIST"

      # MC-345. A green build means "this compiles"; three sprints running,
      # the defects that mattered were things only a rendered page showed -
      # a search box that never filtered, a chart labelled with the wrong
      # years. This drives the real components against a stub of the real
      # contract.
      #
      # No browser download: the runner image already has Google Chrome and
      # verify/harness.mjs prefers it under CI. `playwright` proper would
      # pull ~150 MB per install, per repo, for a check that runs in
      # seconds.
      - name: Drive the app against a stub of the API
        if: inputs.verify
        run: npm run verify

      # ⚠️ continue-on-error, because the build and the browser drive above
      # are the gate and this upload is the hand-off to the deploy job. On
      # 2026-09-17 the account's artifact storage quota was full, and a run
      # whose 41 browser assertions had all passed went red on this step -
      # the same failure java-service.yml had the day before. When the
      # upload fails the deploy job is skipped (it has nothing to deploy)
      # and the summary says so; the next push after the quota clears
      # deploys normally.
      - name: Upload artifact
        id: dist
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-dist
          path: dist/${{ inputs.app-name }}/browser
          retention-days: 7

      - name: Note a failed artifact upload
        if: always() && steps.dist.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ Build artifact was not uploaded — deploy skipped"
            echo
            echo "The build and its checks passed; only the artifact upload failed"
            echo "(usually the account's artifact storage quota, which recalculates"
            echo "every 6–12 hours). Nothing was deployed from this run. Re-run it,"
            echo "or push again, once the quota clears."
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys the artifact the build job already verified, rather than
  # rebuilding. A deploy that rebuilds can ship something the checks never
  # saw — the tokens assertion above would be testing a different bundle
  # from the one users get.
  deploy:
    name: Deploy to Static Web Apps
    needs: build
    # Skipped, not failed, when the build could not hand over its output.
    if: inputs.deploy && needs.build.outputs.dist-uploaded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Static Web Apps posts the preview URL as a PR comment. Without this
      # the deploy still works and the comment silently fails.
      pull-requests: write

    steps:
      # ⚠️ A repo with deploy: true but no Static Web App yet gets a clear
      # skip, not a failure.
      #
      # Without this, the deploy action fails with an authentication error
      # that reads like a broken token rather than an absent one — and a
      # repo sits red for as long as it takes somebody to create the Azure
      # resource. Turning the intent on before the resource exists is a
      # perfectly reasonable order to do things in, and the pipeline should
      # not punish it.
      - name: Check for a deployment token
        id: token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — no Static Web App yet"
              echo
              echo "\`${{ inputs.app-name }}\` asks to be deployed, but this"
              echo "repository has no \`AZURE_STATIC_WEB_APPS_API_TOKEN\` secret."
              echo
              echo "Create the Static Web App and add its deployment token as that"
              echo "secret; the next push publishes with no further code change."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: ${{ inputs.app-name }}-dist
          path: dist

      # Push to main -> production. Pull request -> its own preview
      # environment, torn down when the PR closes. The action picks which
      # from the triggering event; nothing here needs to branch on it.
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          # Already built and checked in the previous job. Without these the
          # action tries to detect and build the app itself, which for an
          # Angular workspace means building the wrong thing or nothing.
          skip_app_build: true
          skip_api_build: true
