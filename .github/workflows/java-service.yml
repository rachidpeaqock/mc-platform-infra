name: Java service (reusable)

# Shared build pipeline for every Spring Boot service on the platform.
#
# Callers pass nothing but their name; the toolchain is convention, so a
# JDK or Spring Boot bump lands in every service from one edit here.
#
#   permissions:            # REQUIRED - see below
#     contents: read
#     packages: write
#   jobs:
#     service:
#       uses: rachidpeaqock/mc-platform-infra/.github/workflows/java-service.yml@main
#       with:
#         service-name: mc-discovery-server
#
# ⚠️ The caller MUST declare `permissions: packages: write`. A called
# workflow can never hold more permission than its caller, and these repos
# default to a read-only token. Omit it and the entire run fails with
# `startup_failure` at 0s - no logs, no annotation, no indication that
# permissions are involved.
#
# Note on why this matters more than usual for this project: the original
# development machine cannot build JVM projects at all (corporate TLS
# interception plus an unreachable internal Maven mirror). Until the work
# moves to Codespaces, THIS WORKFLOW IS THE COMPILER — so it runs tests
# and fails loudly rather than just producing an artifact.

on:
  workflow_call:
    inputs:
      service-name:
        description: Maven artifactId; also the jar name
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '21'
      run-tests:
        required: false
        type: boolean
        default: true
      publish_image:
        # Underscore rather than a hyphen, but only as a convention now.
        #
        # This originally carried a note claiming a hyphenated input in a
        # job-level `if:` is parsed as subtraction and causes the 0s
        # `startup_failure`. That was a hypothesis while bisecting, and it
        # was WRONG — the cause was the caller's permissions, documented at
        # the top of this file. `angular-app.yml` uses `app-name` in exactly
        # that position and is fine.
        description: Build and push a container image to GHCR (main only)
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      # -B batch mode keeps the log readable; the runner reaches Maven
      # Central directly, which is the entire point of building here.
      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Test
        if: inputs.run-tests
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp package -DskipTests

      # The Spring Boot plugin should produce an executable jar. If the
      # plugin is missing or misconfigured you get a thin jar that starts
      # and immediately dies in the cloud — catch that here, not there.
      - name: Verify executable jar
        run: |
          set -e
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n1)
          test -n "$JAR" || { echo "no executable jar in target/"; exit 1; }
          unzip -l "$JAR" | grep -q 'BOOT-INF/' || {
            echo "$JAR is not a Spring Boot executable jar (no BOOT-INF/)."
            echo "spring-boot-maven-plugin is probably missing from the build."
            exit 1
          }
          echo "OK: $JAR ($(du -h "$JAR" | cut -f1))"

      # ⚠️ The jar is deliberately NOT uploaded any more.
      #
      # It was, on every push, with 7-day retention — roughly 70 MB a time
      # across four backend repos — and nothing consumed it: the publish
      # job builds the image from source in a multi-stage Dockerfile and
      # never downloads it. On 2026-09-16 the account's artifact storage
      # quota filled, and a build whose 215 tests had all passed went red
      # on the upload step. The image in GHCR is the deliverable; a jar
      # nobody fetches is storage spent on nothing.

      # MC-213. Services that pin their API contract write the generated
      # spec to target/openapi.json during the test run. Publishing it here
      # does two jobs: every merge leaves a downloadable record of the
      # contract as it shipped, and it is how a service bootstraps its
      # first baseline — the test writes one, this uploads it, and
      # `gh run download` fetches it to be committed.
      #
      # `if: always()` because the most useful time to have the spec is the
      # run where the contract check just failed. `if-no-files-found: ignore`
      # so services without an API (the registry, the gateway) are unaffected.
      # ⚠️ continue-on-error, because this upload is a convenience and the
      # tests above are the gate. A storage-quota blip on a few kilobytes
      # of JSON must not turn a green build red — it did once, and the
      # first symptom was a failed run with every test passing. When it
      # does fail, the summary below says so rather than letting the
      # bootstrap path for a contract baseline vanish silently.
      - name: Upload OpenAPI spec
        id: spec
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-name }}-openapi
          path: target/openapi.json
          if-no-files-found: ignore
          retention-days: 14

      # ⚠️ When the upload fails, the spec goes into the job LOG instead.
      #
      # The artifact quota that broke the upload takes 6–12 hours to
      # recalculate, and the one time the spec is genuinely needed is the
      # first push of a new service — when the contract test fails by
      # design because no baseline exists yet. Waiting half a day for
      # storage accounting to catch up is not a bootstrap path. The log is
      # not subject to the quota, and this fetches it:
      #
      #   gh run view <run-id> --log | sed -n '/^.*::BEGIN openapi.json::/,/::END openapi.json::/p' \
      #     | sed '1d;$d' | sed 's/^[^\t]*\t[^\t]*\t[^ ]* //' > api/openapi.json
      #
      # (the second sed strips the "job<TAB>step<TAB>timestamp " prefix
      # gh puts on every log line).
      - name: Note a failed spec upload
        if: always() && steps.spec.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ OpenAPI spec was not uploaded"
            echo
            echo "The build's tests are the gate; only the artifact upload failed"
            echo "(usually the account's artifact storage quota). The spec is printed"
            echo "in this job's log between \`::BEGIN openapi.json::\` and"
            echo "\`::END openapi.json::\` — see java-service.yml for the one-liner"
            echo "that extracts it into \`api/openapi.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/openapi.json ]; then
            echo "::group::openapi.json (upload failed; the log is the fallback)"
            echo "::BEGIN openapi.json::"
            cat target/openapi.json
            echo
            echo "::END openapi.json::"
            echo "::endgroup::"
          fi

  # Publishing images is what makes `docker compose up` work from anywhere —
  # a developer in a Codespace has one repo checked out, not nine, so compose
  # pulls the other services rather than building them from sibling folders.
  image:
    name: Publish image
    needs: build
    if: inputs.publish_image && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Azure sign-in by OIDC. GitHub mints a short-lived token that Azure
      # trusts because of a federated credential naming this exact repo and
      # branch — so there is no password in Azure and no secret in GitHub.
      #
      # ⚠️ Callers must grant `id-token: write` too. A called workflow can
      # never hold more permission than its caller, and omitting it fails
      # the whole run with `startup_failure` at 0s, exactly as
      # `packages: write` did in Sprint 4.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Azure Container Registry -------------------------------
      # Container Apps pulls from ACR with a managed identity, so nothing
      # at runtime holds a registry credential. GHCR stays as the copy a
      # developer pulls for local compose.
      #
      # Signing in BEFORE the build matters: buildx pushes straight from
      # its build cache and never loads the image into the local docker
      # store, so `docker tag` afterwards would fail with "No such image".
      # One build, both registries, identical digest.
      #
      # Skipped entirely when ACR_NAME is unset, so a repo not wired to
      # Azure still builds.
      - name: Sign in to Azure
        if: vars.ACR_NAME != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to ACR
        if: vars.ACR_NAME != ''
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Work out the tags
        id: tags
        run: |
          GHCR="ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}"
          {
            echo "list<<EOF"
            echo "$GHCR:main"
            echo "$GHCR:${{ github.sha }}"
            if [ -n "${{ vars.ACR_NAME }}" ]; then
              ACR="${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.service-name }}"
              echo "$ACR:main"
              echo "$ACR:${{ github.sha }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # ⚠️ v6 uploads a ".dockerbuild" record as a workflow artifact
          # on every run, unasked. Twenty-five of them were sitting in one
          # repo's artifact storage when the account quota filled on
          # 2026-09-16, and nothing had ever opened one. The image in GHCR
          # is the record.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # GitHub Actions cache keeps Maven dependency layers warm between
          # runs; without it every image build re-resolves the whole tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max
