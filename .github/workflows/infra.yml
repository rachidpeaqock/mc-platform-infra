name: Infrastructure

# The estate as code, checked the way the services are.
#
#   pull request touching bicep/   → compile + lint, and a what-if against
#                                    the dev group so the review shows
#                                    what would change, not what the
#                                    author says would change
#   workflow_dispatch               → what-if or deploy, one stage at a
#                                    time, by a person who chose to
#
# Nothing deploys on merge. E10 is the epic where "built" becomes
# "running", and each step of that is a decision the runbook walks
# through with the person holding the subscription — a template that
# creates a Postgres server on merge would take that decision for them.
#
# ⚠️ Role assignments (AcrPull, Key Vault Secrets User/Officer) need more
# than Contributor. The GitHub identity has Contributor on the resource
# group (README), so `foundation` from here fails on those two resources
# until the identity is also given "Role Based Access Control
# Administrator" on the group — or a person runs stage 1 once (runbook
# §1). `platform` creates no role assignments and Contributor suffices.

on:
  pull_request:
    paths:
      - 'bicep/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Which template
        required: true
        type: choice
        options: [foundation, platform, budget]
      mode:
        description: what-if shows the diff; deploy applies it
        required: true
        type: choice
        default: what-if
        options: [what-if, deploy]
      env:
        description: Environment (parameter file suffix)
        required: true
        type: choice
        default: dev
        options: [dev]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  RG: rg-milestone-command-${{ inputs.env || 'dev' }}

jobs:
  check:
    name: Compile and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler is the check: a template that does not build cannot
      # be what-if'd, and lint catches the classes of mistake (unused
      # params, hardcoded locations, secrets in outputs) a review skims past.
      - name: Compile every template
        run: |
          set -euo pipefail
          az bicep install
          for f in bicep/*.bicep; do
            echo "::group::$f"
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
            echo "::endgroup::"
          done
          # Parameter files need the env vars they read; placeholders are
          # fine for a compile.
          MC_DEPLOYER_OBJECT_ID=00000000-0000-0000-0000-000000000000 \
            az bicep build-params --file bicep/foundation.dev.bicepparam --stdout > /dev/null
          MC_DEPLOYER_OBJECT_ID=00000000-0000-0000-0000-000000000000 \
            az bicep build-params --file bicep/platform.dev.bicepparam --stdout > /dev/null

  what-if:
    name: ${{ inputs.mode || 'what-if' }} · ${{ inputs.stage || 'platform' }}
    needs: check
    # Dispatches do what they were told. PRs get a what-if of the platform
    # stage — the one that changes most — but only where the run can
    # actually sign in, and today it cannot:
    #
    # ⚠️ Found 2026-09-25, on the first Dependabot batch. Every pull
    # request against this repo had a red `what-if · platform`, and had
    # since the workflow was written: `azure/login` answers AADSTS700213,
    # "no matching federated identity record for subject
    # repo:…:pull_request". The deploy app's credentials are deliberately
    # `ref:refs/heads/main` only. So the job was claiming a check it could
    # never pass, and the "post the what-if on the pull request" step
    # below has never run once.
    #
    # Turning it on is a decision, not a fix, which is why it is a
    # variable and not a default: it needs a federated credential whose
    # subject is `repo:<owner>/<repo>:pull_request`, and that grants a
    # token with Contributor on the resource group to *any* run a pull
    # request triggers. On a solo private repo that is no new capability —
    # whoever can push a branch can already push main — and on a repo with
    # outside contributors it is a way to run arbitrary workflow code
    # against the estate. Note it still would not light up these PRs:
    # GitHub withholds the OIDC token from Dependabot-triggered runs, so
    # a dependency bump gets compile-and-lint and nothing more, which is
    # exactly what a dependency bump needs.
    #
    #   az ad app federated-credential create --id $app --parameters '{...":pull_request"}'
    #   gh variable set INFRA_WHATIF_ON_PR -b true
    if: vars.AZURE_CLIENT_ID != '' && (github.event_name != 'pull_request' || vars.INFRA_WHATIF_ON_PR == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # On a pull request this is advisory: before the bootstrap step has
      # put pg-admin-password in the vault, the platform what-if cannot
      # resolve getSecret() and fails for a reason unrelated to the change.
      - name: Run
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          STAGE: ${{ inputs.stage || 'platform' }}
          MODE: ${{ inputs.mode || 'what-if' }}
          ENVN: ${{ inputs.env || 'dev' }}
          # The parameter files read these. The pipeline identity is the
          # deployer here; a person sets them in their own shell (runbook §1).
          MC_DEPLOYER_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
          MC_CONTAINER_ENV_NAME: ${{ vars.CONTAINER_ENV_NAME }}
        run: |
          set -euo pipefail
          az bicep install
          VERB=what-if; [ "$MODE" = deploy ] && VERB=create
          case "$STAGE" in
            budget)
              CMD=(az deployment sub "$VERB" -l francecentral -f bicep/budget.bicep
                   -p env="$ENVN" opsEmail="${{ vars.OPS_EMAIL }}" startDate="$(date -u +%Y-%m-01)")
              ;;
            *)
              CMD=(az deployment group "$VERB" -g "$RG"
                   -f "bicep/$STAGE.bicep" -p "bicep/$STAGE.$ENVN.bicepparam")
              ;;
          esac
          echo "+ ${CMD[*]}"
          "${CMD[@]}" | tee whatif.txt

      - name: Post the what-if on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('whatif.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### what-if · platform · dev\n```\n' + body + '\n```',
            });
